[project]
name = "crypto-arb-engine"
version = "0.1.0"
description = "High-performance, multi-strategy crypto arbitrage detection and execution engine"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
